appId: net.fimaster.nexa
productName: Nexa
copyright: © 2026

# Electron được hoist lên node_modules gốc của workspace, nên electron-builder không tự suy ra
# phiên bản từ apps/desktop. Khai tường minh và giữ khớp với devDependency đã pin.
electronVersion: 43.2.0

# Chạy từ repo root; `app` trỏ vào workspace của ứng dụng. Mọi đường dẫn trong `files`
# tính tương đối với `directories.app`, KHÔNG phải với repo root.
directories:
  app: apps/desktop
  output: release/${version}
  buildResources: apps/desktop/resources

files:
  - out/**/*
  - package.json
  # Dependency được hoist lên node_modules của workspace root.
  - ../../node_modules/mammoth/**/*
  - ../../node_modules/pdfjs-dist/**/*
  # Loại rác không cần trong bộ cài.
  - '!**/*.map'
  - '!**/test/**'
  - '!**/tests/**'
  - '!**/*.ts'
  - '!**/*.md'

extraResources:
  # Chính sách của tổ chức. IT ghi đè file này lúc phân phối (§13.1 feature flag, §11.2 allowlist).
  - from: apps/desktop/resources/policy.json
    to: policy.json

asar: true

# Không còn native module nào trong bộ cài, nên không cần rebuild và không cần asarUnpack.
# SQLite dùng `node:sqlite` có sẵn trong Node 24 của Electron 43 — xem ADR 0003.
npmRebuild: false

win:
  # §21: "Cài và gỡ trên Windows không cần quyền admin nếu chính sách cho phép" — NSIS per-user.
  # MSI dành cho IT phân phối tập trung và CẦN quyền admin. Xem OPEN-QUESTIONS D3.
  target:
    - target: nsis
      arch: [x64]
    - target: msi
      arch: [x64]
  icon: apps/desktop/resources/icon.ico
  # §11.1 "Ký số bộ cài và executable" — điền khi có certificate (TASKLIST T-02-5).
  # certificateSubjectName: 'Ten To Chuc'
  #
  # ⚠️ `signAndEditExecutable` cần công cụ Windows (rcedit) để nhúng icon và version info.
  # Trên Linux nó cần wine. Đã thử: từ Linux ra được `win-unpacked` (cấu hình `files` đúng)
  # nhưng bước tạo NSIS cuối thì không. **Bộ cài phát hành PHẢI build trên Windows** —
  # job `build-windows` trong CI làm việc đó.
  signAndEditExecutable: true
  # Nexa không cần quyền nâng cao.
  requestedExecutionLevel: asInvoker

nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: Nexa
  # Gỡ cài đặt KHÔNG tự xoá dữ liệu người dùng: hội thoại đã mã hoá là tài sản của họ,
  # và §11.1 để việc xoá cho chức năng "Xoá toàn bộ dữ liệu" trong app quyết định.
  deleteAppDataOnUninstall: false
  # Cho phép cài im lặng khi IT triển khai qua endpoint management (§18.2).
  allowElevation: false

msi:
  oneClick: false
  perMachine: true
  createDesktopShortcut: true

publish: null

# §18.1 bước 5: SBOM và checksum sinh trong pipeline CI, không phải ở đây.
