0m-1-2v4h4"/></g><text x="64" y="1086" fill="#141747" font-size="22" font-weight="600" font-family="Segoe UI, Inter, Arial, sans-serif">Cách dùng</text><text x="64" y="1125" fill="#141747" font-size="18" font-weight="400" font-family="Segoe UI, Inter, Arial, sans-serif">Nút chính cho hành động gửi/tạo mới. Nền xanh nhạt biểu thị mục đang chọn và tin nhắn của người dùng.</text><text x="64" y="1158" fill="#141747" font-size="18" font-weight="400" font-family="Segoe UI, Inter, Arial, sans-serif">Bo góc: 14 px cho nút/thẻ nhỏ, 16 px cho tin nhắn, 24 px cho ô nhập. Nhịp khoảng cách cơ sở: 4 px.</text><text x="64" y="1208" fill="#6B7599" font-size="15" font-weight="400" font-family="Segoe UI, Inter, Arial, sans-serif">Lưu ý: bảng SVG là tài liệu vector; chưa phải thư viện component/variant native của Figma. Logo được dựng lại theo ảnh.</text></svg>